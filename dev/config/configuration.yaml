# Dev-only Home Assistant config for previewing the theme.
default_config:
demo:

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/ecovolt/ecovolt-fonts.js

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/pauls-cards.js
      type: module
  dashboards:
    ecovolt-demo:
      mode: yaml
      filename: dashboards/ecovolt-demo.yaml
      title: EcoVolt demo
      icon: mdi:solar-power
      show_in_sidebar: true
